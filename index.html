<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hi, i'm leekhoi</title>
  <style>
    :root {
      --bg-color: #0d0c15;
      --card-bg: rgba(21, 19, 36, 0.75); /* nền card hơi trong suốt tạo hiệu ứng kính mờ */
      --accent-color: #a855f7;
      --accent-hover: #c084fc;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 50px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ảnh background toàn màn hình với opacity 40% */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      opacity: 0.4; /* độ mờ 40% chuẩn ý cậu nè */
      z-index: -2;
    }

    /* lớp phủ chuyển màu tím đen huyền ảo cho nền */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, rgba(168, 85, 247, 0.15), transparent 70%),
                  linear-gradient(to bottom, transparent, var(--bg-color));
      pointer-events: none;
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .profile-header {
      text-align: center;
    }

    .avatar-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-color), #6366f1);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background-color: #151324;
      border: 2px solid var(--bg-color);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .links-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      background-color: var(--card-bg);
      backdrop-filter: blur(8px); /* hiệu ứng kính mờ nhìn xịn cực */
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .link-item:hover {
      border-color: var(--accent-color);
      background-color: rgba(35, 29, 61, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3);
      color: #fff;
    }

    .section-card {
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 10px;
      letter-spacing: -0.2px;
    }

    .about-text {
      color: var(--text-sub);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: var(--accent-hover);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- ảnh background full màn hình -->
  <img class="bg-image" src="./images/banner.jpg" alt="background">
  <div class="bg-overlay"></div>

  <div class="container">
    <!-- header profile -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img class="avatar" src="./images/avatar.jpg" alt="avatar">
      </div>
      <h1>hi, i'm leekhoi</h1>
      <p class="subtitle">welcome to my personal space</p>
    </div>

    <!-- social links -->
    <div class="links-group">
      <a href="https://facebook.com/your-username" target="_blank" class="link-item">facebook</a>
      <a href="https://soundcloud.com/your-username" target="_blank" class="link-item">soundcloud</a>
      <a href="https://tiktok.com/@your-username" target="_blank" class="link-item">tiktok</a>
      <a href="https://github.com/your-username" target="_blank" class="link-item">github</a>
      <a href="https://open.spotify.com/user/your-username" target="_blank" class="link-item">spotify</a>
    </div>

    <!-- about section -->
    <div class="section-card">
      <div class="section-title">about me</div>
      <p class="about-text">
        chào cậu! đây là nơi tớ chia sẻ những thứ nhỏ xíu về bản thân, âm nhạc và sở thích cá nhân. cậu có thể chỉnh sửa dòng giới thiệu này tuỳ thích nhen...
      </p>
      
      <div class="tag-container">
        <span class="tag">#music</span>
        <span class="tag">#vibing</span>
        <span class="tag">#coding</span>
      </div>
    </div>
  </div>

</body>
</html>
